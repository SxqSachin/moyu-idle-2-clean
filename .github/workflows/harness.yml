name: Harness

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  game-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate shared game-data source
        run: node packages/game-data/scripts/build.mjs
      - name: Check committed shared game-data artifacts
        run: |
          test -f packages/game-data/generated/game-data.json
          test -f packages/game-data/generated/game_data.go
          test -f packages/game-data/generated/game-data.ts
          git ls-files --error-unmatch packages/game-data/generated/game-data.json >/dev/null
          git ls-files --error-unmatch packages/game-data/generated/game_data.go >/dev/null
          git ls-files --error-unmatch packages/game-data/generated/game-data.ts >/dev/null
          if ! git diff --quiet -- packages/game-data/generated; then
            echo "::warning::Generated artifacts changed after build. Consider committing packages/game-data/generated updates."
          fi
      - name: Validate schema doc sync with baseline init
        run: bash infra/scripts/check-schema-doc-sync.sh

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
      - name: Run server harness
        working-directory: server
        run: go mod tidy && go test ./...

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Run web typecheck, build and unit harness
        working-directory: web
        run: npm run typecheck && npm run build && npm run test:unit
      - name: Install Playwright browser
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Run E2E harness
        working-directory: web
        run: npm run test:e2e
