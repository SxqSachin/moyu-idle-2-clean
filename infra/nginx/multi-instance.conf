upstream game_backend_api {
  least_conn;
  include /etc/nginx/conf.d/upstreams/game_backend_api.nodes.conf;
  keepalive 128;
}

map $arg_token $ws_sticky_raw {
  default $arg_token;
  ''      $http_authorization;
}

map $ws_sticky_raw $ws_sticky_key {
  default $ws_sticky_raw;
  ''      $remote_addr;
}

upstream game_backend_ws {
  hash $ws_sticky_key consistent;
  include /etc/nginx/conf.d/upstreams/game_backend_ws.nodes.conf;
  keepalive 128;
}

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 443 ssl http2;
  server_name game.example.com;

  # ssl_certificate /etc/nginx/certs/fullchain.pem;
  # ssl_certificate_key /etc/nginx/certs/privkey.pem;

  location /api/ {
    proxy_pass http://game_backend_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
  }

  location /ws {
    proxy_pass http://game_backend_ws/ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
  }
}
