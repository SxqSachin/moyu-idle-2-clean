services:
  server:
    image: ${SERVER_IMAGE:-mysecondwebgame-server:latest}
    container_name: game-server
    build:
      context: ../../server
    environment:
      APP_PORT: 8080
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      AUTH_DB_POOL_MAX_CONNS: ${AUTH_DB_POOL_MAX_CONNS:-4}
      AUTH_DB_TIMEOUT_MS: ${AUTH_DB_TIMEOUT_MS:-800}
      REDIS_ADDR: ${REDIS_ADDR:?REDIS_ADDR is required}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}
      NATS_URL: ${NATS_URL:?NATS_URL is required}
      MQ_TOPIC_PREFIX: ${MQ_TOPIC_PREFIX:-game}
      ORDINARY_SETTLEMENT_ENABLED: ${ORDINARY_SETTLEMENT_ENABLED:-false}
      WS_TARGETED_ROUTING_ENABLED: ${WS_TARGETED_ROUTING_ENABLED:-false}
      WS_BATTLE_BATCH_COMPRESSION_ENABLED: ${WS_BATTLE_BATCH_COMPRESSION_ENABLED:-false}
      SCHEDULER_SHARDS: ${SCHEDULER_SHARDS:-16}
      SCHEDULER_ENGINE: ${SCHEDULER_ENGINE:-minheap}
      SCHEDULER_TICK_MS: ${SCHEDULER_TICK_MS:-100}
      SCHEDULER_WHEEL_SIZE: ${SCHEDULER_WHEEL_SIZE:-512}
      NODE_ADVERTISE_ADDR: ${NODE_ADVERTISE_ADDR:?NODE_ADVERTISE_ADDR is required}
      NODE_REGISTRY_PREFIX: ${NODE_REGISTRY_PREFIX:-ws:backend:node:}
      NODE_HEARTBEAT_SECONDS: ${NODE_HEARTBEAT_SECONDS:-30}
      NODE_HEARTBEAT_INTERVAL_SECONDS: ${NODE_HEARTBEAT_INTERVAL_SECONDS:-10}
      GAME_DATA_PATH: /app/game-data/generated/game-data.json
      GLOBAL_CONFIG_PATH: /app/game-data/game-config/source/global-config.json
      SHARED_GLOBAL_CONFIG_PATH: /app/game-data/game-config/source/shared-global-config.json
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      WS_MESSAGE_KEY: ${WS_MESSAGE_KEY:-}
    ports:
      - "${SERVER_BIND_IP:-0.0.0.0}:${SERVER_PORT:-8080}:8080"
    volumes:
      - ../../packages:/app/game-data
    restart: unless-stopped
