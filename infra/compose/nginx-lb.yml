services:
  nginx:
    image: ${NGINX_IMAGE:-docker.m.daocloud.io/library/nginx:1.27}
    container_name: game-nginx-lb
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ${NGINX_CONF_FILE:-./infra/nginx/multi-tier-lb.conf}:/etc/nginx/conf.d/default.conf:ro
      - ${NGINX_UPSTREAM_DIR:-./infra/nginx/upstreams}:/etc/nginx/conf.d/upstreams:ro
      - ${NGINX_CERT_DIR:-./infra/nginx/certs}:/etc/nginx/certs:ro
    restart: unless-stopped
