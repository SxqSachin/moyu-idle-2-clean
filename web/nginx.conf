upstream game_backend_api {
  least_conn;
  server server:8080;
  keepalive 64;
}

upstream game_backend_ws {
  least_conn;
  server server:8080;
  keepalive 64;
}

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

map $http_accept_encoding $compressed_suffix {
  default "";
  "~*\\bbr\\b" ".br";
  "~*\\bgzip\\b" ".gz";
}

map $http_accept_encoding $compressed_encoding {
  default "";
  "~*\\bbr\\b" "br";
  "~*\\bgzip\\b" "gzip";
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  etag on;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_proxied any;
  gzip_types
    text/plain
    text/css
    text/xml
    application/json
    application/javascript
    application/xml+rss
    application/xml
    image/svg+xml
    font/ttf
    font/otf;

  # Precompressed files are generated at build time and served without requiring
  # dynamic compression modules in the nginx runtime image.
  location ~* ^/assets/.+\.js$ {
    default_type application/javascript;
    gzip off;
    try_files $uri$compressed_suffix $uri =404;
    add_header Content-Encoding $compressed_encoding always;
    add_header Vary "Accept-Encoding" always;
    add_header Cache-Control "public, max-age=2592000, immutable" always;
  }

  location ~* ^/assets/.+\.css$ {
    default_type text/css;
    gzip off;
    try_files $uri$compressed_suffix $uri =404;
    add_header Content-Encoding $compressed_encoding always;
    add_header Vary "Accept-Encoding" always;
    add_header Cache-Control "public, max-age=2592000, immutable" always;
  }

  location ~* ^/assets/.+\.json$ {
    default_type application/json;
    gzip off;
    try_files $uri$compressed_suffix $uri =404;
    add_header Content-Encoding $compressed_encoding always;
    add_header Vary "Accept-Encoding" always;
    add_header Cache-Control "public, max-age=2592000, immutable" always;
  }

  location ~* ^/assets/.+\.svg$ {
    default_type image/svg+xml;
    gzip off;
    try_files $uri$compressed_suffix $uri =404;
    add_header Content-Encoding $compressed_encoding always;
    add_header Vary "Accept-Encoding" always;
    add_header Cache-Control "public, max-age=2592000, immutable" always;
  }

  # Vite hashed assets can be cached aggressively.
  location /assets/ {
    try_files $uri =404;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
  }

  location = /game-data/manifest.json {
    default_type application/json;
    gzip off;
    try_files $uri$compressed_suffix $uri =404;
    add_header Content-Encoding $compressed_encoding always;
    add_header Vary "Accept-Encoding" always;
    add_header Cache-Control "no-cache, must-revalidate" always;
  }

  location ~* ^/game-data/icon-atlas/.+\.json$ {
    default_type application/json;
    gzip off;
    try_files $uri$compressed_suffix $uri =404;
    add_header Content-Encoding $compressed_encoding always;
    add_header Vary "Accept-Encoding" always;
    add_header Cache-Control "no-cache, must-revalidate" always;
  }

  location ~* ^/game-data/assets/.+\.json$ {
    default_type application/json;
    gzip off;
    try_files $uri$compressed_suffix $uri =404;
    add_header Content-Encoding $compressed_encoding always;
    add_header Vary "Accept-Encoding" always;
    add_header Cache-Control "public, max-age=2592000, immutable" always;
  }

  location /game-data/assets/ {
    try_files $uri =404;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
  }

  # Keep app shell revalidating so deploys become visible quickly.
  location = /index.html {
    default_type text/html;
    gzip off;
    try_files $uri$compressed_suffix $uri =404;
    add_header Content-Encoding $compressed_encoding always;
    add_header Vary "Accept-Encoding" always;
    add_header Cache-Control "no-cache, must-revalidate" always;
  }

  location / {
    try_files $uri /index.html;
  }

  location /api/ {
    proxy_pass http://game_backend_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
  }

  location /ws {
    proxy_pass http://game_backend_ws/ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
  }
}
